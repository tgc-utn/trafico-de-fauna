name: Release

# Manual only. Builds the installer from main and creates a draft release with it.
# The version comes from AssemblyFileVersion and the release notes from its section in CHANGELOG.md.
on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.read.outputs.version }}
      notes: ${{ steps.read.outputs.notes }}

    steps:
      - name: Require main
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::Run this workflow from main."
          exit 1

      - uses: actions/checkout@v7

      - name: Read version and release notes
        id: read
        shell: pwsh
        run: |
          $assemblyInfo = Get-Content src/Trafico.De.Fauna/Properties/AssemblyInfo.cs -Raw
          $version = [regex]::Match($assemblyInfo, 'AssemblyFileVersion\("([^"]+)"\)').Groups[1].Value
          if (-not $version) { throw 'AssemblyFileVersion not found' }
          if (git ls-remote --tags origin "refs/tags/$version") { throw "Tag $version already exists" }
          $changelog = Get-Content CHANGELOG.md -Raw
          $section = [regex]::Match($changelog, "(?ms)^## \[$([regex]::Escape($version))\][^\n]*\n(.*?)(?=^## \[|^\[|\z)")
          if (-not $section.Success) { throw "CHANGELOG.md has no section for $version" }
          $delimiter = (New-Guid).Guid
          "version=$version" >> $env:GITHUB_OUTPUT
          "notes<<$delimiter", $section.Groups[1].Value.Trim(), $delimiter >> $env:GITHUB_OUTPUT

  build:
    needs: check
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: TraficoFaunaInstaller-*.exe
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: >-
          gh release create "$VERSION" TraficoFaunaInstaller-*.exe
          --draft --target "$GITHUB_SHA" --title "$VERSION" --notes "$NOTES"
