<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 590 230" width="590" height="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="14">
  <title>Niveles y sectores</title>
  <style>
    .panel { fill: #f7f7f7; stroke: #aaa; }
    .shape { fill: #e9e9e9; stroke: #777; }
    text { fill: #222; }
    .outside { fill: #777; }
    @media (prefers-color-scheme: dark) {
      .panel { fill: #2a2f34; stroke: #6b7279; }
      .shape { fill: #3d444b; stroke: #9aa0a6; }
      text { fill: #eee; }
      .outside { fill: #9aa0a6; }
    }
  </style>
  <g class="panel">
    <rect x="10" y="40" width="298" height="115"/>
    <rect x="320" y="7" width="258" height="215"/>
  </g>
  <g class="shape">
    <!-- Nivel 1 -->
    <rect x="20" y="58" width="92" height="70"/>
    <rect x="112" y="73" width="93" height="37"/>
    <rect x="205" y="58" width="95" height="70"/>
    <!-- Nivel 2 -->
    <rect x="435" y="15" width="93" height="70"/>
    <rect x="460" y="85" width="47" height="63"/>
    <rect x="413" y="148" width="137" height="47"/>
    <rect x="320" y="128" width="93" height="87"/>
  </g>
  <g font-style="italic">
    <text class="outside" x="25" y="30">Nivel 1</text>
    <text x="330" y="26">Nivel 2</text>
  </g>
  <g text-anchor="middle">
    <text x="66" y="98">Sector 1</text>
    <text x="158" y="97">Sector 2</text>
    <text x="252" y="98">Sector 3</text>
    <text x="481" y="55">Sector 1</text>
    <text x="483" y="113">Sector</text>
    <text x="483" y="130">2</text>
    <text x="481" y="177">Sector 3</text>
    <text x="366" y="177">Sector 4</text>
  </g>
</svg>
