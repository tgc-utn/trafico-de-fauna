<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <title>Máquina de estados del enemigo</title>
  <style>
    .shape { fill: #e9e9e9; stroke: #777; }
    .line { fill: none; stroke: #777; }
    .head { fill: #777; }
    text { fill: #222; }
    @media (prefers-color-scheme: dark) {
      .shape { fill: #3d444b; stroke: #9aa0a6; }
      .line { stroke: #9aa0a6; }
      .head { fill: #9aa0a6; }
      text { fill: #eee; }
    }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <g class="line" marker-end="url(#flecha)">
    <!-- Rotating <-> Walking -->
    <path d="M290 58 Q330 44 370 62"/>
    <path d="M370 62 Q330 76 290 58"/>
    <!-- Rotating <-> Watching -->
    <path d="M234.5 90.2 Q240.2 146.1 275.5 189.8"/>
    <path d="M275.5 189.8 Q269.8 133.9 234.5 90.2"/>
    <!-- Walking <-> Chasing -->
    <path d="M455.4 100.1 Q460.3 151.4 494.6 189.9"/>
    <path d="M494.6 189.9 Q489.7 138.6 455.4 100.1"/>
    <!-- Watching <-> Chasing -->
    <path d="M360 225 Q400 209 440 225"/>
    <path d="M440 225 Q400 241 360 225"/>
    <!-- Rotating for Watching <-> Watching -->
    <path d="M150 232 Q185 214 220 228"/>
    <path d="M220 228 Q185 246 150 232"/>
  </g>
  <g class="shape">
    <ellipse cx="220" cy="55" rx="70" ry="36"/>
    <ellipse cx="440" cy="65" rx="70" ry="36"/>
    <ellipse cx="80" cy="235" rx="70" ry="36"/>
    <ellipse cx="290" cy="225" rx="70" ry="36"/>
    <ellipse cx="510" cy="225" rx="70" ry="36"/>
  </g>
  <g text-anchor="middle">
    <text x="220" y="60">Rotating</text>
    <text x="440" y="70">Walking</text>
    <text x="80" y="230">Rotating for</text>
    <text x="80" y="248">Watching</text>
    <text x="290" y="230">Watching</text>
    <text x="510" y="230">Chasing</text>
  </g>
</svg>
