<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="15">
  <title>Máquina de estados del enemigo</title>
  <style>
    .shape { fill: #e9e9e9; stroke: #777; }
    .line { fill: none; stroke: #777; }
    .head { fill: #777; }
    text { fill: #222; }
    @media (prefers-color-scheme: dark) {
      .shape { fill: #3d444b; stroke: #9aa0a6; }
      .line { stroke: #9aa0a6; }
      .head { fill: #9aa0a6; }
      text { fill: #eee; }
    }
  </style>
  <defs>
    <marker id="flecha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <g class="line" marker-end="url(#flecha)">
    <!-- Patrulla -->
    <path d="M177 35 L423 35"/>
    <path d="M423 55 L177 55"/>
    <path d="M490 79 L490 201"/>
    <path d="M410 235 L180 235"/>
    <path d="M110 201 L110 79"/>
    <!-- Persecucion: desde cualquier estado de patrulla -->
    <path d="M158 70 L252 117"/>
    <path d="M442 70 L348 117"/>
    <path d="M159 211 L251 166"/>
    <path d="M438 209 L349 166"/>
  </g>
  <g class="shape">
    <ellipse cx="110" cy="45" rx="70" ry="34"/>
    <ellipse cx="490" cy="45" rx="70" ry="34"/>
    <ellipse cx="300" cy="142" rx="70" ry="34"/>
    <ellipse cx="110" cy="235" rx="70" ry="34"/>
    <ellipse cx="490" cy="235" rx="80" ry="34"/>
  </g>
  <g text-anchor="middle">
    <text x="110" y="50">Rotating</text>
    <text x="490" y="50">Walking</text>
    <text x="300" y="147">Chasing</text>
    <text x="110" y="240">Watching</text>
    <text x="490" y="230">Rotating for</text>
    <text x="490" y="248">Watching</text>
  </g>
</svg>
