<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 240" width="260" height="284" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <title>Cono de visión del enemigo</title>
  <style>
    .shape { fill: #e9e9e9; stroke: #777; }
    .cone { fill: #f6d98a; stroke: #8a6d1c; }
    .line { fill: none; stroke: #555; }
    .dash { fill: none; stroke: #555; stroke-dasharray: 4 3; }
    .dot { fill: #333; }
    text { fill: #222; }
    @media (prefers-color-scheme: dark) {
      .shape { fill: #3d444b; stroke: #9aa0a6; }
      .cone { fill: #7a6521; stroke: #e0c56a; }
      .line { stroke: #c8cdd2; }
      .dash { stroke: #c8cdd2; }
      .dot { fill: #eee; }
      text { fill: #eee; }
    }
  </style>
  <!-- Vision sphere centred on the enemy; the cone opens 45 degrees to each side of the facing direction (up) -->
  <circle class="shape" cx="110" cy="105" r="95"/>
  <path class="cone" d="M110 105 L42.8 37.8 A95 95 0 0 1 177.2 37.8 Z"/>
  <path class="dash" d="M110 105 L110 10"/>
  <path class="line" d="M110 105 L205 105"/>
  <circle class="dot" cx="110" cy="105" r="4"/>
  <g text-anchor="middle">
    <text x="90" y="52" font-size="13">45°</text>
    <text x="130" y="52" font-size="13">45°</text>
    <text x="110" y="124" font-size="11">Enemigo</text>
    <text x="158" y="99" font-size="11">Distancia</text>
    <text x="158" y="118" font-size="11">máxima</text>
    <text x="110" y="222" font-size="11">La línea punteada es la dirección</text>
    <text x="110" y="236" font-size="11">en la que mira el enemigo</text>
  </g>
</svg>
